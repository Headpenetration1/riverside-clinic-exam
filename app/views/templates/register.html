{% extends "base.html" %}
{% block title %}Register - Riverside Clinic{% endblock %}
{% block content %}
<h2>Create a patient account</h2>
<form method="post" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="full_name">Full name</label>
  <input id="full_name" name="full_name" type="text" required maxlength="120">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="username">
  <label for="password">Password (at least 15 characters)</label>
  <input id="password" name="password" type="password" required minlength="15" autocomplete="new-password">
  <p><button type="submit">Register</button></p>
</form>
{% endblock %}
