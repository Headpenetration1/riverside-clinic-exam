{% extends "base.html" %}
{% block title %}Forgot password - Riverside Clinic{% endblock %}
{% block content %}
<h2>Forgot your password?</h2>
<p>Enter the email address you registered with. If it is on file, we will send a link that works for 30 minutes.</p>
<form method="post" class="stack">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required autocomplete="username">
  <p><button type="submit">Send reset link</button></p>
</form>
{% endblock %}
